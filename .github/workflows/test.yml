name: Tests
run-name: "Tests ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
    - master
  pull_request:

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      CI: true
      TRUFFLERUBYOPT: "--engine.Mode=latency"
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1.7", "3.2.11", "3.3.12", "3.4.1", "jruby-9.4"]
        test_command: ["bundle exec rake test"]
        include:
          - ruby: "head"
            test_command: "bundle exec rake test || true"
          - ruby: "truffleruby"
            test_command: "bundle exec rake test || true"
          - ruby: "3.2.11"
            test_command: "./ci/run_rubocop_specs || true"
          - ruby: "3.3.12"
            test_command: "./ci/run_rubocop_specs || true"
          - ruby: "3.4.1"
            test_command: "./ci/run_rubocop_specs || true"
    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      continue-on-error: true
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
    - name: Install Ragel
      run: |
        sudo apt-get update
        sudo apt-get install ragel
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run tests
      run: |
        ${{ matrix.test_command }}
